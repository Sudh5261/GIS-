<body>
    <!-- 🔹 Main Contact Section -->
    <div class="boxes">
        <!-- Left box: Map + Email -->
        <div class="box1 common-properties-of-boxes">

            <div class="map-icon">
                <a href="https://www.google.com/maps/place/..."><i class="fa-solid fa-location-dot"></i></a>
            </div>
            <!-- Email link -->
            <div class="box1-email">

                </a>
            </div>
        </div>

        <!-- Right box: Contact form -->
        <div class="box2 common-properties-of-boxes">
            <div class="box2-name all-input-box2">
                <input placeholder="Name">
            </div>
            <div class="box2-email all-input-box2">
                <input placeholder="Email">
            </div>
            <div class="box2-message all-input-box2">
                <input placeholder="Message">
            </div>
            <!-- Send message button -->
            <div class="box2-sendmessage">
                <button id="box2-send-button">Send Message</button>
            </div>
        </div>
    </div>
</body>
